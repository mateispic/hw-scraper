name: Hot Wheels Scraper

on:
  schedule:
    - cron: "0 * * * *"   # la fiecare oră
  workflow_dispatch:         # buton de run manual pe GitHub
    inputs:
      dry_run:
        description: "Dry run (fără Supabase și email)"
        type: boolean
        default: false
      scrapers:
        description: "Ce scrapere rulează (separate prin virgulă)"
        type: string
        default: "smyk_html,noriel"
      max_pages:
        description: "Câte pagini per site (gol = toate; 1 ajunge pentru un test)"
        type: string
        default: ""
      page_delay:
        description: "Secunde de pauză între pagini"
        type: string
        default: "15"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
          # gol la rulările programate -> folosește ce e activat în scrapers/__init__.py
          SCRAPERS: ${{ inputs.scrapers }}
          # pauză între pagini; la rulările programate 15 secunde
          PAGE_DELAY: ${{ inputs.page_delay || '15' }}
        run: python check_hotwheels.py ${{ inputs.max_pages && format('--max-pages {0}', inputs.max_pages) || '' }}
